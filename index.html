const EYE=5.4,walk={on:false,yaw:0,pitch:-.05,pos:new THREE.Vector3(),keys:new Set(),tw:null,drag:null,last:0};

function canPass(a,b,x0,z0,x1,z1){
  if(a===b)return true;

    if(f.side!==OPP[e.side]||Math.abs(f.fixed-e.fixed)>.05)continue;

}
function entryPoint(r){

    ray.setFromCamera(ndc,camera);const hit=ray.intersectObjects(house.children,true).find(h=>!h.object.material?.transparent);
    let o=hit?.object;while(o&&!o.userData.roomId)o=o.parent;if(!o)return;

${Object.entries(LISTS).map(([f,l])=>`${f} (per ${UNITS[f]}): `+l.map(o=>`${o.id} = ${o.name} $${o.low}-${o.high}`).join('; ')).join('\n')}
Paint palette: ${PAINTS.map(p=>`${p.n} ${p.c}`).join(', ')}
Cabinet/vanity palette: ${CAB_COLORS.map(p=>`${p.n} ${p.c}`).join(', ')}`;
function designText(){
  const t=totals();
  return S.rooms.map(r=>{const q=qty(r),x=t.rooms.find(y=>y.r===r);
    const f={floor:r.floor,wall:r.wall,wallColor:r.wallColor,trim:r.trim,trimColor:r.trimColor,ceiling:r.ceiling};
    if(r.type==='kitchen')Object.assign(f,{cabinet:r.cabinet,cabinetColor:r.cabinetColor,counter:r.counter,backsplash:r.backsplash,cabLF:r.cabLF,island:r.island});
    if(r.type==='bath')Object.assign(f,{vanity:r.vanity,vanityColor:r.vanityColor,shower:r.shower,showerSf:r.showerSf});
    const qs=`floor ${q.A} SF, walls ${q.WA} SF, base ${q.LF} LF`+(r.type==='kitchen'?`, cabinets ${q.cabLF} LF, counters ${q.ctr} SF, backsplash ${q.bs} SF`:'');
    return `- id ${r.id}: ${r.name} (${r.type}, ${(r.level||1)===2?'upstairs':'downstairs'}, ${r.w}x${r.d} ft; ${qs}; now $${Math.round(x.low)}-${Math.round(x.high)}) ${JSON.stringify(f)}`;}).join('\n')
    +`\nWhole house now: $${Math.round(t.low)}-${Math.round(t.high)}${S.settings.contingency?' including 10% contingency':''}. Room currently open on screen: ${selRoom()?.name||'none'}.`;
}
function applyChanges(list){
  let n=0;const touched=new Set();
  for(const c of Array.isArray(list)?list:[]){
    const f=String(c?.field||''),kind=AI_FIELDS[f];if(!kind)continue;
    const key=String(c.room??'').toLowerCase();
    const targets=key==='all'?S.rooms:S.rooms.filter(r=>r.id.toLowerCase()===key||r.name.toLowerCase()===key);
    let v=c.value;
    if(kind==='list'){if(!BY[f][v])continue}
    else if(kind==='color'){v=String(v).toLowerCase();if(!/^#[0-9a-f]{6}$/.test(v))continue}
    else if(kind==='num'){v=Number(v);if(!isFinite(v))continue;v=f==='cabLF'?Math.min(50,Math.max(6,Math.round(v))):Math.min(400,Math.max(0,Math.round(v)))}
    else v=v===true||v==='true';
    for(const r of targets){
      if(KITCHEN_ONLY.has(f)&&r.type!=='kitchen')continue;
      if(BATH_ONLY.has(f)&&r.type!=='bath')continue;
      if(String(r[f]).toLowerCase()!==String(v).toLowerCase()){r[f]=v;n++;touched.add(r.name)}
    }
  }
  return {n,rooms:[...touched]};
}
const AI_ERR={rate_limited:'Claude is busy or you have hit your usage limit. Try again in a little while.',session_expired:'Your Claude sign-in expired. Sign in again, then retry.',
  refused:'Claude could not help with that one. Try asking a different way.',invalid_json:'Claude’s answer came back garbled. Try again, or ask for a little less at once.',
  empty_completion:'Claude didn’t answer. Try rephrasing.',prompt_too_large:'That conversation got too long. Clear it and start fresh.'};
const AI_OFF=new Set(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed']);
function scrollChat(){requestAnimationFrame(()=>{pbody.scrollTop=pbody.scrollHeight})}
async function askClaude(text){
  text=String(text||'').trim();if(!text||S.aiBusy||!sample)return;
  const history=S.chat.filter(m=>m.role==='user'||m.role==='assistant').slice(-8).map(m=>({role:m.role,content:m.content}));
  while(history.length&&history[0].role!=='user')history.shift();
  S.chat.push({role:'user',content:text});S.draft='';S.aiBusy=true;renderPanel();scrollChat();
  aiCtl=new AbortController();
  const before=snapshot(),sel=S.sel;
  try{
    const input=[{role:'user',content:AI_RULES},...history,{role:'user',content:`CURRENT DESIGN:\n${designText()}\n\nHER REQUEST: ${text}`}];
    const out=await sample.json(input,{signal:aiCtl.signal,cache:false});
    const reply=typeof out?.reply==='string'&&out.reply.trim()?out.reply.trim():'Done.';
    const res=applyChanges(out?.changes);
    const msg={role:'assistant',content:reply};
    if(res.n){msg.n=res.n;msg.rooms=res.rooms;msg.before=before;msg.sel=sel;S.chat.forEach(m=>delete m.canUndo);msg.canUndo=true;S.aiBusy=false;S.chat.push(msg);commit();msg.total=fmtR(totals().low,totals().high);renderPanel()}
    else{S.aiBusy=false;S.chat.push(msg);renderPanel()}
  }catch(e){
    S.aiBusy=false;
    if(AI_OFF.has(e?.code)){S.aiOff=true;S.chat.push({role:'error',content:'Claude isn’t available on this page for your account, so this tab is turned off. Everything else still works.'})}
    else if(e?.code==='cancelled')S.chat.push({role:'error',content:'Stopped.'});
    else S.chat.push({role:'error',content:AI_ERR[e?.code]||'Something went wrong reaching Claude. Try again.'});
    renderPanel();
  }
  scrollChat();
}
function aiTab(){
  if(!sample&&!S.aiOff) return `<p class="note">Connecting to Claude…</p>`;
  const intro=`<section class="blk"><h3>Tell Claude what you want</h3><p class="note">Describe a look, a mood, or a budget. Claude picks finishes from this catalog, puts them on the model, and the cost updates. Every change can be undone.</p>
    ${S.chat.length?'':`<div class="ideas">${IDEAS.map(t=>`<button type="button" class="idea" data-act="idea" data-text="${esc(t)}">${esc(t)}</button>`).join('')}</div>`}</section>`;
  const msgs=S.chat.map((m,i)=>m.role==='user'?`<div class="msg me">${esc(m.content)}</div>`
    :m.role==='error'?`<div class="msg err">${esc(m.content)}</div>`
    :`<div class="msg cl">${esc(m.content)}${m.n?`<div class="did"><span>${m.undone?'Undone':`Changed ${m.n} finish${m.n>1?'es':''} in ${esc(m.rooms.join(', '))}`}</span>${m.total&&!m.undone?`<span>House now <span class="mono">${m.total}</span></span>`:''}${m.canUndo&&!m.undone?`<button type="button" class="ghost sm" data-act="undo" data-i="${i}">Undo</button>`:''}</div>`:''}</div>`).join('');
  const busy=S.aiBusy?`<div class="thinking"><span>Claude is thinking. This can take up to a minute.</span><button type="button" class="ghost sm" data-act="stop">Stop</button></div>`:'';
  const compose=S.aiOff?'':`<div class="compose"><label class="sr" for="aiInput">Message to Claude</label><textarea id="aiInput" placeholder="e.g. Lighter floors everywhere, and a navy kitchen with white quartz" ${S.aiBusy?'disabled':''}>${esc(S.draft)}</textarea>
    <div class="row"><button type="button" class="ghost sm" data-act="clearchat" ${S.chat.length&&!S.aiBusy?'':'hidden'}>Clear conversation</button><button type="button" class="btn" data-act="send" ${S.aiBusy?'disabled':''}>Send</button></div></div>`;
  return `${intro}<div class="chat">${msgs}${busy}</div>${compose}`;
}
async function initSample(){
  try{sample=await window.claude?.use?.('sample')??null}catch{sample=null}
  if(!sample){S.aiOff=true;S.chat=[{role:'error',content:'Ask Claude works when this page is opened on claude.ai while signed in. Everything else still works here.'}]}
  else{try{S.photoOK=!!(await sample.limits())?.images}catch{S.photoOK=false}
    try{assetsApi=await window.claude?.use?.('assets')??null}catch{assetsApi=null}}
  if(S.tab==='ai'||S.tab==='room')renderPanel();
}
/* ---------- her furniture photos ---------- */
let assetsApi=null;S.photoBusy=null;S.photoOK=false;
const FURN_TYPES=new Set(['bedroom','living','dining','office','hall']);
const FURN_LABELS={sofa:'Sofa',chair:'Accent chairs',rug:'Rug',wood:'Wood furniture',bed:'Bed / headboard',bedding:'Bedding',chairs:'Dining chairs',accent:'Pillows'};
function furnBlock(r){
  if(!FURN_TYPES.has(r.type))return '';
  const F=r.furn||{},keys=Object.keys(F).filter(k=>FURN_LABELS[k]),mine=!!r.photos?.length;
  let body=`<p class="note">${esc(mine&&r.furnNote?r.furnNote:'Add photos of the furniture you own for this room. Claude looks at them and recolors the sofa, bed, rug, wood pieces and chairs in the model to match.')}</p>`;
  if(mine)body+=`<div class="fphotos">${r.photos.map(id=>`<img src="/_blob/${id}" alt="Furniture photo" loading="lazy">`).join('')}</div>`;
  if(keys.length)body+=`<div class="fchips">${keys.map(k=>`<span class="fchip"><i style="background:${F[k]}"></i>${FURN_LABELS[k]}</span>`).join('')}</div>`;
  if(S.photoBusy===r.id)body+=`<div class="thinking">Claude is looking at your photos. This can take up to a minute.</div>`;
  else if(S.photoOK)body+=`<div class="row"><label class="btn sm filebtn" for="furnPhotos">Add furniture photos</label><input type="file" id="furnPhotos" accept="image/jpeg,image/png,image/webp" multiple hidden>${mine?`<button type="button" class="ghost sm" data-act="clearfurn">${S.pending==='cf'+r.id?'Confirm':'Remove my photos'}</button>`:''}</div>`;
  else body+=`<p class="note">Photo matching works when this page is opened on claude.ai while signed in.</p>`;
  return blk('Your furniture',mine?'from your photos':keys.length?'from the listing photos':'generic',body);
}
async function shrink(file){
  try{const bm=await createImageBitmap(file),s=Math.min(1,1400/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
    c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',.85))}catch{return file}
}
async function matchFurniture(files){
  const r=selRoom();if(!r||!sample||!files?.length||S.photoBusy)return;
  const lim=await sample.limits().catch(()=>null),max=Math.min(4,lim?.images?.maxCount||4);
  S.photoBusy=r.id;renderPanel();
  try{
    const blobs=await Promise.all([...files].slice(0,max).map(shrink));
    const out=await sample.json(`These photos show furniture the homeowner owns for the ${r.name} (${TYPES[r.type]}). A 3D model of the room draws simple furniture, and its colors should match these pieces.
Reply with only JSON: {"summary": "one or two short plain sentences naming the pieces you see and their colors", "colors": {"sofa": "#rrggbb", "chair": "#rrggbb", "rug": "#rrggbb", "wood": "#rrggbb", "bed": "#rrggbb", "bedding": "#rrggbb", "chairs": "#rrggbb", "accent": "#rrggbb"}}
Include only keys for pieces you can see. sofa = sofa or sectional upholstery. chair = accent or lounge chairs. rug = the main rug. wood = the main wood or case-goods finish (tables, dressers, nightstands, desk). bed = headboard or bed frame. bedding = duvet or comforter. chairs = dining chairs. accent = throw pillows. Give each color as it would look in daylight.`,{images:blobs,cache:false});
    const colors={};for(const [k,v] of Object.entries(out?.colors||{}))if(FURN_LABELS[k]&&/^#[0-9a-f]{6}$/i.test(String(v)))colors[k]=String(v).toLowerCase();
    if(!Object.keys(colors).length)throw {code:'no_colors'};
    r.furn={...(r.furn||{}),...colors};r.furnNote=typeof out.summary==='string'?out.summary.slice(0,300):'';
    if(assetsApi){const ids=[];for(const b of blobs){try{ids.push((await assetsApi.upload(b,{type:'image/jpeg'})).id)}catch{}}r.photos=[...(r.photos||[]),...ids].slice(-8)}
    else r.photos=r.photos||[];
    S.photoBusy=null;commit();toast(`${r.name} furniture now matches your photos`);
  }catch(e){
    S.photoBusy=null;renderPanel();
    toast(e?.code==='no_colors'?'Claude couldn’t pick out furniture in those photos. Try clearer shots of each piece.':AI_OFF.has(e?.code)?'Photo matching isn’t available for this account.':(AI_ERR[e?.code]||'Something went wrong reading the photos. Try again.'));
  }
}
function renderHeader(){
  const t=totals();$('#tot').textContent=fmtR(t.low,t.high);
  $('#samplePill').hidden=!S.isSample&&!S.approx;$('#samplePill').textContent=S.isSample?'Sample floor plan':'Measured first floor';
  document.querySelectorAll('[data-level]').forEach(b=>b.classList.toggle('on',+b.dataset.level===S.level));
  $('#levelSeg').hidden=!S.rooms.some(r=>(r.level||1)===2)&&S.level===1;
  $('#sfcount').textContent=`${fmtN(t.sf)} SF · ${S.rooms.length} rooms`;
}
function renderPanel(){
  const focus=document.activeElement?.id,top=pbody.scrollTop;
  pbody.innerHTML=({room:roomTab,ai:aiTab,budget:budgetTab,layout:layoutTab,saved:savedTab})[S.tab]();
  pbody.scrollTop=top;
  document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  if(focus){const el=document.getElementById(focus);if(el&&pbody.contains(el))el.focus({preventScroll:true})}
}
function render(){renderHeader();renderPanel()}
function commit(rebuild=true){if(rebuild)build();render();persist()}
function showLevel(n,fly){
  n=+n||1;const changed=n!==S.level;S.level=n;
  document.querySelectorAll('[data-level]').forEach(b=>b.classList.toggle('on',+b.dataset.level===n));
  if(changed&&fly){build();camView('angle')}
}
function select(id){const r=S.rooms.find(x=>x.id===id);if(!r)return;S.sel=id;if((r.level||1)!==S.level){showLevel(r.level||1);if(!walk.on)camView('angle')}if(walk.on)placeIn(r);if(S.tab!=='layout'&&S.tab!=='ai')S.tab='room';build();render()}

const RELATED={wall:['wall','wallColor'],trim:['trim','trimColor'],floor:['floor'],ceiling:['ceiling']};
const NOUN={wall:'Walls',trim:'Baseboard',floor:'Flooring',ceiling:'Ceiling'};
pbody.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const r=selRoom(),act=b.dataset.act;
  if(act!=='delroom'&&act!=='reset'&&act!=='delsave')S.pending=null;
  if(act==='set'||act==='color'){r[b.dataset.field]=b.dataset.val;commit()}
  else if(act==='all'){const fs=RELATED[b.dataset.field],tg=S.rooms.filter(o=>b.dataset.scope==='all'||o.type===r.type);for(const o of tg)for(const f of fs)o[f]=r[f];commit();toast(`${NOUN[b.dataset.field]} applied to ${tg.length} rooms`)}
  else if(act==='pick') select(b.dataset.id);
  else if(act==='idea') askClaude(b.dataset.text);
  else if(act==='send') askClaude($('#aiInput')?.value);
  else if(act==='stop') aiCtl?.abort();
  else if(act==='clearchat'){S.chat=[];renderPanel()}
  else if(act==='clearfurn'){
    if(S.pending!=='cf'+r.id){S.pending='cf'+r.id;renderPanel();return}
    S.pending=null;const ids=r.photos||[];
    if(assetsApi)for(const id of ids){try{await assetsApi.delete(id)}catch{}}
    r.photos=[];r.furnNote='';r.furn=houseRooms().find(x=>x.name===r.name)?.furn||null;commit();toast('Removed your photos')}
  else if(act==='undo'){const m=S.chat[+b.dataset.i];if(m?.before&&applyState(m.before)){S.sel=S.rooms.some(r=>r.id===m.sel)?m.sel:S.sel;m.undone=true;commit();toast('Undid Claude’s changes')}}
  else if(act==='addroom'){const bb=S.rooms.reduce((m,o)=>Math.max(m,o.x+o.w),0);const n=R('New room','bedroom',bb,0,12,12,{level:S.level});S.rooms.push(n);S.sel=n.id;S.isSample=false;commit();camView('angle');toast('Added a 12′ × 12′ room on the right side')}
  else if(act==='delroom'){const id=b.dataset.id;if(S.pending!=='del'+id){S.pending='del'+id;renderPanel();return}
    S.pending=null;S.rooms=S.rooms.filter(o=>o.id!==id);if(S.sel===id)S.sel=S.rooms[0]?.id||null;S.isSample=false;commit()}
  else if(act==='reset'){if(S.pending!=='reset'){S.pending='reset';renderPanel();return}
    S.pending=null;S.rooms=houseRooms();S.sel=S.rooms.find(r=>r.type==='living').id;S.isSample=false;S.approx=true;showLevel(1);commit();camView('angle')}
  else if(act==='save'){
    const inp=$('#saveName'),name=inp.value.trim()||`Design ${designs().length+1}`,t=totals();
    const doc={name,savedAt:Date.now(),low:Math.round(t.low),high:Math.round(t.high),state:snapshot()};
    let ok=false;
    if(db&&dbWritable){try{await db.collection('designs').add(doc);ok=true}catch(err){if(err?.code==='invalid_argument')dbWritable=false}}
    if(!ok){const a=localDesigns();a.unshift({id:'l'+Date.now().toString(36),...doc});ok=setLocalDesigns(a);if(!remoteDesigns)renderPanel()}
    toast(ok?`Saved “${name}”`:'Could not save. This browser is blocking storage.');
  }
  else if(act==='load'){const d=designs().find(x=>x.id===b.dataset.id);if(d&&applyState(d.state)){S.tab='room';commit();camView('angle');toast(`Opened “${d.name}”`)}}
  else if(act==='delsave'){const id=b.dataset.id;if(S.pending!=='ds'+id){S.pending='ds'+id;renderPanel();return}
    S.pending=null;
    if(remoteDesigns&&db){try{await db.collection('designs').doc(id).delete()}catch{toast('Could not delete that design')}}
    else{setLocalDesigns(localDesigns().filter(x=>x.id!==id));renderPanel()}}
});
pbody.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr[data-act]'))select(e.target.dataset.id)});
pbody.addEventListener('keydown',e=>{if(e.target.id==='aiInput'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();askClaude(e.target.value)}});
pbody.addEventListener('input',e=>{if(e.target.id==='cabLF')$('#cabLFv').textContent=e.target.value+' LF';if(e.target.id==='aiInput')S.draft=e.target.value});
pbody.addEventListener('change',e=>{
  const el=e.target,r=selRoom();
  if(el.id==='roomSel') return select(el.value);
  if(el.dataset.pick){r[el.dataset.pick]=el.value;return commit()}
  if(el.id==='furnPhotos'){matchFurniture(el.files);return}
  if(el.id==='cabLF'){r.cabLF=+el.value;return commit()}
  if(el.id==='island'){r.island=el.checked;return commit()}
  if(el.id==='showerSf'){r.showerSf=Math.max(0,+el.value||0);return commit(false)}
  if(el.id==='optDemo'){S.settings.demo=el.checked;return commit(false)}
  if(el.id==='optCont'){S.settings.contingency=el.checked;return commit(false)}
  if(el.id==='ceilH'){S.settings.height=+el.value;return commit()}
  if(el.dataset.lf){
    const o=S.rooms.find(x=>x.id===el.dataset.id);if(!o)return;const k=el.dataset.lf;
    if(k==='name')o.name=el.value.trim()||'Room';
    else if(k==='type'){o.type=el.value;Object.assign(o,typeDefaults(o.type))}
    else if(k==='level'){o.level=+el.value===2?2:1;showLevel(o.level,true)}
    else{const v=parseFloat(el.value);if(!isFinite(v))return renderPanel();o[k]=(k==='w'||k==='d')?Math.max(2,v):v}
    S.isSample=false;S.sel=o.id;commit();
  }
});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;S.pending=null;renderPanel()}));
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{if(walk.on)exitWalk();camView(b.dataset.view)}));
$('#walkBtn').addEventListener('click',()=>walk.on?exitWalk():enterWalk());
$('#tourPrev').addEventListener('click',()=>tourStep(-1));
$('#tourNext').addEventListener('click',()=>tourStep(1));
$('#tourExit').addEventListener('click',exitWalk);
const WALK_KEYS=new Set(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright']);
addEventListener('keydown',e=>{if(!walk.on||e.target.closest?.('input,textarea,select'))return;const k=e.key.toLowerCase();if(WALK_KEYS.has(k)){walk.keys.add(k);e.preventDefault()}if(k==='escape')exitWalk()});
addEventListener('keyup',e=>walk.keys.delete(e.key.toLowerCase()));

document.querySelectorAll('[data-walls]').forEach(b=>b.addEventListener('click',()=>{S.walls=b.dataset.walls;document.querySelectorAll('[data-walls]').forEach(x=>x.classList.toggle('on',x===b));build()}));
document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>{
  showLevel(b.dataset.level,true);const r=selRoom();
  if(r&&(r.level||1)!==S.level){S.sel=S.rooms.find(x=>(x.level||1)===S.level)?.id||S.sel;build();render()}
}));
$('#wideBtn').addEventListener('click',e=>{const on=document.querySelector('.app').classList.toggle('wide');e.currentTarget.setAttribute('aria-pressed',on);e.currentTarget.textContent=on?'Show panel':'Bigger view'});
$('#fsBtn').addEventListener('click',async()=>{const st=$('#stage');try{if(document.fullscreenElement)await document.exitFullscreen();else await st.requestFullscreen()}catch{toast('Full screen isn’t available here. Use Bigger view instead.')}});
document.addEventListener('fullscreenchange',()=>{$('#fsBtn').textContent=document.fullscreenElement?'Exit full screen':'Full screen'});
